<mat-card class="example-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title-group>
        <mat-card-title>{{movie.title}}</mat-card-title>
    </mat-card-title-group>
    </mat-card-header>
    <mat-card-content>
      {{movie.description}}
     
    </mat-card-content>
    <mat-card-actions>
      <button mat-button [routerLink]="['/edit',movie.id]">Edit movie</button>
      <button mat-button [routerLink]="['/delete',movie.id]">Delete movie</button>
    </mat-card-actions>
  </mat-card>
