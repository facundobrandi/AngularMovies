<div class="form-container">

  <mat-card class="movie-card">

    <mat-card-title>Add new movie</mat-card-title>

    <mat-card-content>
      <form [formGroup]="movieForm" (ngSubmit)="saveMovie()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Title</mat-label>
          <input matInput formControlName="title">

          <mat-error *ngIf="movieForm.get('title')?.touched && movieForm.get('title')?.hasError('required')">
            El título es obligatorio
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description</mat-label>
          <textarea matInput rows="4" formControlName="description"></textarea>

          <mat-error *ngIf="movieForm.get('description')?.touched && movieForm.get('description')?.hasError('required')">
            La descripción es obligatoria
          </mat-error>
        </mat-form-field>

        <div class="actions">
          <button
            mat-raised-button
            color="primary"
            type="submit"
            [disabled]="movieForm.invalid"
          >
            Save movie
          </button>
        </div>

      </form>
    </mat-card-content>

  </mat-card>

</div>
